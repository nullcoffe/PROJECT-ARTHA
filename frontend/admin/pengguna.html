<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#FFFDF0">
    <title>Manajemen Pengguna | ARTHA</title>
    <!-- SHARED: warna, reset, layout, sidebar, header -->
    <link rel="stylesheet" href="../assets/css/shared/variables.css">
    <link rel="stylesheet" href="../assets/css/shared/reset.css">
    <link rel="stylesheet" href="../assets/css/web/layout.css">
    <link rel="stylesheet" href="../assets/css/web/sidebar.css">
    <link rel="stylesheet" href="../assets/css/web/header.css">
    <link rel="stylesheet" href="../assets/css/mobile/layout.css">
    <link rel="stylesheet" href="../assets/css/mobile/sidebar.css">
    <link rel="stylesheet" href="../assets/css/mobile/header.css">

    <link rel="stylesheet" href="../assets/css/web/admin/pengguna.css">
    <link rel="stylesheet" href="../assets/css/mobile/admin/pengguna.css">
</head>
<body>
    <input type="checkbox" id="sidebar-toggle" class="sidebar-checkbox"
           aria-label="Buka atau tutup navigasi">

    <div class="dashboard-layout">
        <aside class="sidebar" aria-label="Navigasi Admin">
            <div class="sidebar-brand">
                <div class="brand-left">
                    <img src="../assets/images/Logo.svg" alt="Logo ARTHA" class="brand-logo">
                    <span class="brand-title">ARTHA</span>
                </div>
                <label for="sidebar-toggle" class="close-sidebar-btn" aria-label="Tutup sidebar">
                    <img src="../assets/icons/actions/cancel.svg" alt="">
                </label>
            </div>

            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-item">
                    <img src="../assets/icons/sidebar/dashboard.svg" class="nav-icon" alt="">
                    <span>Dashboard</span>
                </a>
                <a href="pengguna.html" class="nav-item active" aria-current="page">
                    <img src="../assets/icons/sidebar/pengguna.svg" class="nav-icon" alt="">
                    <span>Pengguna</span>
                </a>
                <a href="produk&stok.html" class="nav-item">
                    <img src="../assets/icons/sidebar/produk&amp;stok.svg" class="nav-icon" alt="">
                    <span>Produk &amp; Stok</span>
                </a>
                <a href="transaksi.html" class="nav-item">
                    <img src="../assets/icons/sidebar/transaksi.svg" class="nav-icon" alt="">
                    <span>Transaksi</span>
                </a>
                <a href="../index.html" class="nav-item logout">
                    <img src="../assets/icons/actions/logout.svg" class="nav-icon" alt="">
                    <span>Keluar</span>
                </a>
            </nav>
        </aside>

        <main class="main-content">
            <header class="dashboard-header">
                <div class="header-left">
                    <label for="sidebar-toggle" class="hamburger-btn" aria-label="Buka sidebar">
                        <img src="../assets/icons/actions/hamburger.svg" alt="">
                    </label>
                    <a href="dashboard.html" class="mobile-brand" aria-label="ARTHA">
                        <img src="../assets/images/Logo.svg" alt="">
                        <span>ARTHA</span>
                    </a>
                    <h1 class="desktop-page-title">Manajemen Pengguna</h1>
                </div>
                <div class="header-right">
                    <div class="admin-profile">
                        <div class="profile-circle">
                            <img src="../assets/icons/header/profile.svg" alt="">
                        </div>
                        <span>Admin</span>
                    </div>
                </div>
            </header>

            <h1 class="mobile-page-title">Manajemen Pengguna</h1>

            <div class="page-container admin-users-content">
                <div class="users-toolbar">
                    <button type="button" class="add-user-button" id="showUserForm">
                        + Tambah Pengguna
                    </button>
                </div>

                <section class="users-table-card" aria-label="Daftar pengguna">
                    <div class="users-table-wrapper">
                        <table class="users-table">
                            <thead>
                                <tr>
                                    <th>Nama</th>
                                    <th>Username</th>
                                    <th>Jenis Pengguna</th>
                                    <th>Kata Sandi</th>
                                    <th>Aksi</th>
                                </tr>
                            </thead>
                            <tbody>
                            <tr>
                                <td>Muthe</td>
                                <td>Muthe.Pemilik</td>
                                <td><span class="role-badge role-owner">Pemilik</span></td>
                                <td>
                                    <div class="password-cell">
                                        <input type="password" value="muthe123" readonly aria-label="Kata sandi Muthe">
                                        <button type="button" class="password-toggle" aria-label="Tampilkan kata sandi">
                                            <img src="../assets/icons/actions/eye.svg" alt="">
                                        </button>
                                    </div>
                                </td>
                                <td class="users-actions">
                                    <button type="button" class="action-button edit-button" aria-label="Edit Muthe">
                                        <img src="../assets/icons/actions/edit.svg" alt="">
                                    </button>
                                    <button type="button" class="action-button delete-button" aria-label="Hapus Muthe">
                                        <img src="../assets/icons/actions/delete.svg" alt="">
                                    </button>
                                </td>
                            </tr>
                            <tr>
                                <td>Laudya</td>
                                <td>Laudya.Pemilik</td>
                                <td><span class="role-badge role-owner">Pemilik</span></td>
                                <td>
                                    <div class="password-cell">
                                        <input type="password" value="laudya123" readonly aria-label="Kata sandi Laudya">
                                        <button type="button" class="password-toggle" aria-label="Tampilkan kata sandi">
                                            <img src="../assets/icons/actions/eye.svg" alt="">
                                        </button>
                                    </div>
                                </td>
                                <td class="users-actions">
                                    <button type="button" class="action-button edit-button" aria-label="Edit Laudya">
                                        <img src="../assets/icons/actions/edit.svg" alt="">
                                    </button>
                                    <button type="button" class="action-button delete-button" aria-label="Hapus Laudya">
                                        <img src="../assets/icons/actions/delete.svg" alt="">
                                    </button>
                                </td>
                            </tr>
                            <tr>
                                <td>Abin</td>
                                <td>Abin.Kasir</td>
                                <td><span class="role-badge role-cashier">Kasir</span></td>
                                <td>
                                    <div class="password-cell">
                                        <input type="password" value="abin123" readonly aria-label="Kata sandi Abin">
                                        <button type="button" class="password-toggle" aria-label="Tampilkan kata sandi">
                                            <img src="../assets/icons/actions/eye.svg" alt="">
                                        </button>
                                    </div>
                                </td>
                                <td class="users-actions">
                                    <button type="button" class="action-button edit-button" aria-label="Edit Abin">
                                        <img src="../assets/icons/actions/edit.svg" alt="">
                                    </button>
                                    <button type="button" class="action-button delete-button" aria-label="Hapus Abin">
                                        <img src="../assets/icons/actions/delete.svg" alt="">
                                    </button>
                                </td>
                            </tr>
                            <tr>
                                <td>Alra</td>
                                <td>Alra.Kasir</td>
                                <td><span class="role-badge role-cashier">Kasir</span></td>
                                <td>
                                    <div class="password-cell">
                                        <input type="password" value="alra123" readonly aria-label="Kata sandi Alra">
                                        <button type="button" class="password-toggle" aria-label="Tampilkan kata sandi">
                                            <img src="../assets/icons/actions/eye.svg" alt="">
                                        </button>
                                    </div>
                                </td>
                                <td class="users-actions">
                                    <button type="button" class="action-button edit-button" aria-label="Edit Alra">
                                        <img src="../assets/icons/actions/edit.svg" alt="">
                                    </button>
                                    <button type="button" class="action-button delete-button" aria-label="Hapus Alra">
                                        <img src="../assets/icons/actions/delete.svg" alt="">
                                    </button>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </section>

                <section class="user-form-card" id="userFormSection">
                    <h2>Form Pengguna</h2>
                    <form class="user-form" id="userForm">
                        <div class="form-field">
                            <label for="newName">Nama</label>
                            <input type="text" id="newName" name="name" placeholder="Masukan nama pengguna" required>
                        </div>
                        <div class="form-field">
                            <label for="newUsername">Username</label>
                            <input type="text" id="newUsername" name="username" placeholder="Masukan Username" required>
                        </div>
                        <div class="form-field">
                            <label for="newRole">Nama Pengguna</label>
                            <select id="newRole" name="role" required>
                                <option value="">Pilih Pengguna</option>
                                <option value="pemilik">Pemilik</option>
                                <option value="kasir">Kasir</option>
                            </select>
                        </div>
                        <div class="form-field">
                            <label for="newPassword">Kata Sandi</label>
                            <div class="form-password-field">
                                <input type="password" id="newPassword" name="password" placeholder="Masukan kata sandi" required>
                                <button type="button" class="password-toggle form-eye" aria-label="Tampilkan kata sandi">
                                    <img src="../assets/icons/actions/eye.svg" alt="">
                                </button>
                            </div>
                        </div>
                        <div class="form-actions">
                            <button type="submit" class="save-user-button">Simpan</button>
                            <button type="reset" class="cancel-user-button">Batal</button>
                        </div>
                    </form>
                </section>
            </div>
        </main>
        <label for="sidebar-toggle" class="sidebar-overlay" aria-label="Tutup sidebar"></label>
    </div>

    <script>
        // Interaksi UI: tampilkan/sembunyikan kata sandi.
        document.querySelectorAll(".password-toggle").forEach((button) => {
            button.addEventListener("click", () => {
                const input = button.parentElement.querySelector("input");
                if (!input) return;
                input.type = input.type === "password" ? "text" : "password";
            });
        });

        // Tombol tambah mengarahkan pengguna ke form di bawah tabel.
        document.getElementById("showUserForm").addEventListener("click", () => {
            document.getElementById("userFormSection").scrollIntoView({
                behavior: "smooth",
                block: "nearest"
            });
            document.getElementById("newName").focus({ preventScroll: true });
        });

        // Form belum terhubung ke backend/database.
        document.getElementById("userForm").addEventListener("submit", (event) => {
            event.preventDefault();
            alert("Tampilan form siap. Hubungkan proses Simpan ke backend untuk menyimpan pengguna.");
        });
    </script>
</body>
</html>
