<!-- Popup KHUSUS Admin/Pengguna; buka: href="#popup-delete-user"; tombol Hapus hanya tampilan -->
<div class="artha-popup-overlay" id="popup-delete-user" role="presentation">
  <section class="artha-popup artha-popup--delete" role="dialog" aria-modal="true" aria-labelledby="delete-popup-title" aria-describedby="delete-popup-description">
    <span class="delete-popup-icon" aria-hidden="true"><img src="../assets/icons/actions/delete.svg" alt=""></span>
    <h2 id="delete-popup-title">Hapus Akun Pengguna?</h2>
    <p id="delete-popup-description">Apakah Anda yakin ingin menghapus akun ini? Data pengguna yang telah dihapus tidak dapat dipulihkan kembali.</p>
    <div class="delete-popup-actions">
      <a href="#" class="artha-popup-btn artha-popup-btn--cancel">Batal</a>
      <!-- Tombol Hapus: UI saja, aksi penghapusan disambungkan ke backend nanti. -->
      <button type="button" class="artha-popup-btn artha-popup-btn--danger">Hapus</button>
    </div>
  </section>
</div>
