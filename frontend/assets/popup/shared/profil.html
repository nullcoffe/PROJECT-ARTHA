
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Poppins, Arial, sans-serif;
            background: transparent;
        }

        .profile-mini {
            width: 100%;
            max-width: 300px;
            padding: 18px 16px;

            background: white;
            border: 1px solid #E0E6F0;
            border-radius: 14px;
            box-shadow: 0 8px 28px rgba(0,24,63,.15);
        }

        .profile-head {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar {
            width: 45px;
            height: 45px;
            flex-shrink: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #E9EFFB;
            border-radius: 50%;
        }

        .avatar img {
            width: 23px;
            height: 23px;
        }

        .profile-info strong {
            display: block;
            font-size: 15px;
            color: #18243A;
        }

        .profile-info small {
            color: #7180A5;
            font-size: 12px;
        }

        .role {
            display: inline-block;
            margin-top: 13px;
            padding: 5px 11px;

            background: #E9EFFB;
            color: #142F7D;
            border-radius: 20px;

            font-size: 11px;
            font-weight: 600;
        }

        .divider {
            height: 1px;
            margin: 17px 0 12px;
            background: #E2E8F0;
        }

        .change-password {
            display: flex;
            justify-content: space-between;
            align-items: center;
            min-height: 38px;

            color: #18243A;
            font-size: 13px;
            font-weight: 600;
            text-decoration: none;
        }

        .change-password img {
            width: 17px;
            height: 17px;
        }

        .change-password-left {
            display: flex;
            align-items: center;
            gap: 9px;
        }

        .password-overlay {
            position: fixed;
            inset: 0;

            display: none;
            align-items: center;
            justify-content: center;

            background: rgba(0,24,63,.5);
        }

        .password-overlay:target {
            display: flex;
        }

        .password-modal {
            width: min(400px, calc(100% - 32px));
            padding: 22px 18px;

            background: white;
            border-radius: 16px;
        }

        .password-modal h2 {
            margin: 0 0 18px;
            color: #18243A;
            font-size: 20px;
        }

        .password-modal input {
            width: 100%;
            height: 46px;
            margin-bottom: 14px;
            padding: 0 12px;

            border: 2px solid #DCE3EF;
            border-radius: 10px;
            font: inherit;
            font-size: 13px;
        }

        .password-modal button {
            width: 100%;
            height: 46px;

            color: white;
            background: #142F7D;
            border: none;
            border-radius: 9px;
            font-weight: 600;
        }

        .password-modal .cancel {
            display: block;
            margin-top: 15px;
            text-align: center;
            color: #7180A5;
            text-decoration: none;
            font-size: 13px;
        }
    </style>
</head>

<body>

    <section class="profile-mini">

        <div class="profile-head">
            <div class="avatar">
                <img src="../../icons/header/profile.svg" alt="">
            </div>

            <div class="profile-info">
                <strong>Nama Pengguna</strong>
                <small>username</small>
            </div>
        </div>

        <span class="role">Pemilik</span>

        <div class="divider"></div>

        <a href="#password-modal"
           class="change-password">

            <span class="change-password-left">
                <img src="../../icons/actions/edit.svg" alt="">
                Ubah Password
            </span>

            <span>›</span>
        </a>

    </section>

    <div id="password-modal" class="password-overlay">

        <div class="password-modal">

            <h2>Ubah Password</h2>

            <form>
                <input type="password"
                       placeholder="Password baru"
                       required>

                <input type="password"
                       placeholder="Konfirmasi password baru"
                       required>

                <button type="button">
                    Simpan Password
                </button>
            </form>

            <a href="#" class="cancel">Batal</a>

        </div>

    </div>

</body>
</html>
